<div class="container">
  <h4 class="mb-3">LightFusion</h4>

  <p class="text-muted">
    Discover supported Hue and Govee lights, then build synchronized virtual groups.
  </p>

  <button
    id="discover-button"
    type="button"
    class="btn btn-primary"
  >
    Discover Lights
  </button>

  <div
    id="status"
    class="mt-3"
  ></div>

  <div
    id="devices"
    class="mt-3"
  ></div>
</div>

<script>
(async () => {
  const button = document.getElementById('discover-button');
  const status = document.getElementById('status');
  const devices = document.getElementById('devices');

  button.addEventListener('click', async () => {
    button.disabled = true;
    status.textContent = 'Discovering lights...';
    devices.innerHTML = '';

    try {
      const result = await homebridge.request('/discover');

      status.textContent =
        `Found ${result.length} light(s)`;

      for (const light of result) {
        const item = document.createElement('div');
        item.className = 'card mb-2';

        item.innerHTML = `
          <div class="card-body">
            <strong>${light.name}</strong><br>
            <small>
              ${light.providerId} · ${light.id}
              ${light.model ? ` · ${light.model}` : ''}
            </small>
          </div>
        `;

        devices.appendChild(item);
      }
    } catch (error) {
      status.textContent =
        `Discovery failed: ${error.message}`;
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
